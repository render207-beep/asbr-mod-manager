name: Build NRO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar proyecto
        run: |
          DIR=$(dirname "$(find . -name CMakeLists.txt | head -1)")
          echo "Proyecto en: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build
          dkp-pacman -S --needed --noconfirm switch-cmake switch-curl switch-glfw switch-mesa switch-glm switch-libwebp switch-zlib switch-mbedtls

      - name: Descargar Borealis
        working-directory: ${{ env.PROJ }}
        run: git clone --depth 1 --recursive https://github.com/xfangfang/borealis library/borealis

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: |
          export DEVKITPRO=/opt/devkitpro
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          cmake --build build

      - name: Crear NRO
        working-directory: ${{ env.PROJ }}
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$PATH:$DEVKITPRO/tools/bin
          ELF=$(find build -name asbr_mod_manager.elf | head -1)
          echo "ELF: $ELF"
          rm -rf romfs && mkdir romfs
          cp -r library/borealis/resources/. romfs/
          cp -r resources/. romfs/
          nacptool --create "ASBR Mod Manager" "asbr" "0.1.0" app.nacp
          elf2nro "$ELF" asbr_mod_manager.nro --nacp=app.nacp --romfsdir=romfs
          ls -la asbr_mod_manager.nro

      - name: Reunir resultado
        run: |
          mkdir -p out
          cp ${{ env.PROJ }}/asbr_mod_manager.nro out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: asbr_mod_manager
          path: out/asbr_mod_manager.nro
          if-no-files-found: error
