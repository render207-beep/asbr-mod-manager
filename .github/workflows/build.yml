name: Build NRO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar proyecto
        run: |
          DIR=$(dirname "$(find . -name CMakeLists.txt | head -1)")
          echo "Proyecto en: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build
          dkp-pacman -S --needed --noconfirm switch-cmake switch-curl switch-glfw switch-mesa switch-glm switch-libwebp switch-zlib switch-mbedtls

      - name: Descargar Borealis
        working-directory: ${{ env.PROJ }}
        run: git clone --depth 1 --recursive https://github.com/xfangfang/borealis library/borealis

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: |
          export DEVKITPRO=/opt/devkitpro
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          cmake --build build
          echo "=== Contenido de build ==="
          ls -la build

      - name: Reunir resultado
        run: |
          mkdir -p out
          find . -name "*.nro" -not -path "./out/*" -exec cp {} out/ \;
          find . -name "*.elf" -not -path "./out/*" -exec cp {} out/ \;
          echo "=== Archivos encontrados ==="
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: asbr_mod_manager
          path: out/*
          if-no-files-found: error
